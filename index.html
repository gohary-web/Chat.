<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شات جيت هاب المشفر</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: white; padding: 20px; }
        #chat-box { height: 400px; border: 1px solid #30363d; overflow-y: auto; margin-bottom: 10px; padding: 10px; background: #161b22; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #30363d; }
        input[type="text"] { width: 60%; background: #0d1117; color: white; }
        button { background: #238636; color: white; cursor: pointer; }
        .msg { margin-bottom: 10px; padding: 5px; border-bottom: 1px border-color: #21262d; }
    </style>
</head>
<body>
    <h2>🔐 غرفتنا الخاصة على GitHub</h2>
    
    <div id="setup">
        <input type="password" id="token" placeholder="أدخل GitHub Token">
        <input type="password" id="secretKey" placeholder="كلمة سر التشفير">
    </div>

    <div id="chat-box">جاري تحميل المحادثة...</div>

    <input type="text" id="messageInput" placeholder="اكتب رسالة...">
    <button onclick="sendMessage()">إرسال عبر GitHub</button>

    <script>
        const OWNER = 'elgoharymd';
        const REPO = 'Chat.'; // اسم المستودع (مثلاً secret-chat)
        const FILE_PATH = 'chat.json'; // الملف الذي ستخزن فيه الرسائل

        // وظيفة لجلب الرسائل من جيت هاب
        async function fetchMessages() {
            const token = document.getElementById('token').value;
            if(!token) return;

            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await response.json();
                const content = atob(data.content); // فك تشفير Base64 الخاص بجيت هاب
                const messages = JSON.parse(content);
                displayMessages(messages, data.sha);
            } catch (e) { console.error("لا توجد رسائل بعد أو التوكن خطأ"); }
        }

        function displayMessages(messages, sha) {
            const key = document.getElementById('secretKey').value;
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            
            messages.forEach(m => {
                let text = m.text;
                if(key) {
                    try {
                        const bytes = CryptoJS.AES.decrypt(m.text, key);
                        text = bytes.toString(CryptoJS.enc.Utf8) || "[رسالة مشفرة بكلمة سر مختلفة]";
                    } catch(e) { text = "[فشل فك التشفير]"; }
                }
                box.innerHTML += `<div class="msg"><b>${m.user}:</b> ${text}</div>`;
            });
            window.lastSha = sha; // نحفظ الـ SHA لتحديث الملف لاحقاً
        }

        async function sendMessage() {
            const token = document.getElementById('token').value;
            const key = document.getElementById('secretKey').value;
            const msgInput = document.getElementById('messageInput');
            
            if(!token || !key || !msgInput.value) return alert("أكمل البيانات!");

            const encryptedMsg = CryptoJS.AES.encrypt(msgInput.value, key).toString();
            
            // 1. جلب الرسائل القديمة أولاً
            let currentMessages = [];
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await res.json();
                currentMessages = JSON.parse(atob(data.content));
            } catch(e) {}

            // 2. إضافة الرسالة الجديدة
            currentMessages.push({ user: 'صديق', text: encryptedMsg, time: new Date() });

            // 3. رفع الملف المحدث لجيت هاب
            await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: "update chat",
                    content: btoa(JSON.stringify(currentMessages)),
                    sha: window.lastSha
                })
            });
            
            msgInput.value = '';
            fetchMessages();
        }

        // تحديث تلقائي كل 10 ثوانٍ
        setInterval(fetchMessages, 10000);
    </script>
</body>
</html>
